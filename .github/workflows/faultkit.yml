name: faultkit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write # only for the faultkit PR comment

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/pip install --quiet -r requirements.txt

      - name: Tests
        run: .venv/bin/python -m pytest -q

      # Runs once the faultkit skill has written .faultkit/invariants/manifest.json.
      - name: Prove resilience invariants
        if: hashFiles('.faultkit/invariants/manifest.json') != ''
        uses: faultkit/action@97410fbd6eea8b15ed7afbda3204cbd71f7ad918 # v1.1.0
        with:
          threshold: 100
          github-token: ${{ github.token }}
